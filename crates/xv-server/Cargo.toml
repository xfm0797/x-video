[package]
name = "xv-server"
version.workspace = true
edition.workspace = true
description = "本地 HTTP 接口与静态页面服务"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
xv-app = { path = "../xv-app" }
xv-library = { path = "../xv-library" }
xv-player = { path = "../xv-player" }
xv-win = { path = "../xv-win" }
rusqlite = "0.32"

[dev-dependencies]
tempfile = "3"
