name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: 打包 Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 下载 libmpv 播放内核
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-libmpv.mjs

      - name: 构建安装包（NSIS）
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --bundles nsis --verbose 2>&1 | tee tauri-build.log

      # 失败时把日志发成 issue：本机网络访问不了 Actions 日志页，
      # 但 issue 正文可以通过公开 API 匿名读取，便于排查。
      - name: 失败时上传日志
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "运行：$RUN_URL"
            echo '```'
            tail -n 200 tauri-build.log 2>/dev/null || echo "(无日志文件)"
            echo '```'
          } > failure.log
          gh issue create \
            --title "build-failure ${GITHUB_RUN_ID}" \
            --body-file failure.log || true

      - name: 收集安装包
        shell: bash
        run: |
          # Cargo workspace 的 target 在仓库根目录，安装器落在 target/release/bundle；
          # 非 workspace 项目才会落到 src-tauri/target，两处都找一遍。
          mkdir -p bundles
          for dir in target/release/bundle src-tauri/target/release/bundle; do
            if [ -d "$dir" ]; then
              find "$dir" -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} bundles/ \;
            fi
          done
          ls -la bundles

      - name: 校验安装包非空
        shell: bash
        run: |
          set -e
          count=$(ls -1 bundles/*.exe 2>/dev/null | wc -l)
          echo "安装包数量：$count"
          if [ "$count" -lt 1 ]; then
            echo "没有生成 NSIS 安装包" >&2
            ls -R target/release/bundle src-tauri/target/release/bundle 2>/dev/null || true
            exit 1
          fi
          size=$(stat -c %s bundles/*.exe | head -1)
          echo "首个安装包体积：$((size/1024/1024)) MB"
          if [ "$size" -lt 5242880 ]; then
            echo "安装包体积异常偏小" >&2
            exit 1
          fi

      - name: 创建草稿 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "X-Video ${GITHUB_REF_NAME#v}" \
            --draft --prerelease \
            --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" bundles/* --clobber || true

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-video-windows
          path: bundles/*
          if-no-files-found: ignore
          retention-days: 14
