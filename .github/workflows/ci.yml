name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 编译验证与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 前端类型检查与构建
        run: npm ci && npm run build

      - name: Rust 检查
        run: cargo check -p xv-core -p xv-server

      - name: Rust 单元测试
        run: cargo test -p xv-core

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
