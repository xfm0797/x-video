name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 编译验证与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: 前端类型检查与构建
        run: npm ci && npm run build

      - name: Rust 检查（核心 + 服务 + 内核 + 桌面壳）
        run: cargo check -p xv-core -p xv-server -p xv-mpv -p x-video

      - name: Rust 单元测试
        run: cargo test -p xv-core -p xv-mpv

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
