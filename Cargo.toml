[workspace]
resolver = "2"
members = ["crates/xv-core", "crates/xv-server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["gzip", "brotli", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
percent-encoding = "2"

[profile.release]
lto = "thin"
strip = true
