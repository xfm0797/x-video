[workspace]
resolver = "2"
members = [
  "crates/xv-player",
  "crates/xv-media",
  "crates/xv-library",
  "crates/xv-win",
  "crates/xv-app",
  "crates/xv-server",
  "src-tauri",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
opt-level = 2
